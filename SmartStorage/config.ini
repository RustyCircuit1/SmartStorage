; SmartStorage configuration
; This file belongs to the user.
; SmartStorage will never modify or overwrite this file.

[General]

; How SmartStorage handles Deposit Similar.
; Supported values:
;   Keybind - Uses SmartStorage's own Deposit All key.
;   Expand  - Expands Windrose's normal Deposit Similar action.
; Default: Keybind
ModMode=Keybind


[Keybinds]

; Key used for Deposit All when ModMode=Keybind.
; Default: F5
DepositAllKey=F5

; Key used to include/exclude the storage under the crosshair.
; Default: F6
ExclusionKey=F6


[Logging]

; Supported values:
;   Default - Normal messages, warnings and errors.
;   Debug   - Additional technical diagnostic information.
LoggingMode=Default